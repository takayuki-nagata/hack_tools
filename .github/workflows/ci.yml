name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        compiler: [ gcc, clang ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: make all CC=${{ matrix.compiler }}

      - name: Run tests
        run: make test CC=${{ matrix.compiler }}

  m2h-quality:
    name: Python (m2h) Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: cd m2h && uv sync

      - name: Run Ruff Lint
        run: make m2h-lint

      - name: Run Ruff Format Check
        run: make m2h-format-check

      - name: Run Mypy Strict Typecheck
        run: make m2h-typecheck

      - name: Run Pytest Coverage (100% Target)
        run: make m2h-coverage

  e2e-c-compiler:
    name: End-to-End C -> Hack Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install MSP430 GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-msp430

      - name: Build has
        run: make has

      - name: Sync m2h dependencies
        run: cd m2h && uv sync

      - name: Run E2E C compilation tests
        run: make e2e-test

  coverage:
    name: C Test Coverage (has: gcov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run coverage
        run: make coverage

  sanitizers:
    name: C Sanitizers (has: ASan & UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run sanitizers
        run: make sanitize

  valgrind:
    name: Memory Leak Check (has: Valgrind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build
        run: make all DEBUG=1

      - name: Run Valgrind on has
        run: |
          mkdir -p test_out
          valgrind --error-exitcode=1 --leak-check=full has/has -o test_out/all.hack tests/asm/all_instructions.asm
          valgrind --error-exitcode=1 --leak-check=full has/has -o test_out/sym.hack tests/asm/symbols.asm
          valgrind --error-exitcode=1 --leak-check=full has/has -o test_out/math.hack tests/asm/math_loop.asm
          valgrind --error-exitcode=1 --leak-check=full has/has -r -o test_out/math.bin tests/asm/math_loop.asm
          valgrind --error-exitcode=1 --leak-check=full has/has -c -o test_out/math.coe tests/asm/math_loop.asm
          valgrind --error-exitcode=1 --leak-check=full tests/unit_test

  lint-and-format:
    name: C Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: make format-check

      - name: Strict warning build
        run: make lint
