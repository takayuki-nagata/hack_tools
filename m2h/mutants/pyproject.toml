[project]
name = "m2h"
version = "0.1.0"
description = "MSP430 to Hack assembly transpiler and Hack C compiler frontend"
authors = [{ name = "Takayuki Nagata" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
m2h = "m2h.cli:main"
hcc = "m2h.hcc:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mutmut>=2.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["RET505", "RET506"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=m2h --cov-report=term-missing"

[tool.mutmut]
source_paths = ["src/m2h/"]
runner = "pytest"
